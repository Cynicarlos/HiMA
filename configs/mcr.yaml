name: MCR
test_as_valid: true
manual_seed: 3407 # is all you need
output: runs
with_raw_loss: true

loss:
  types:
  - L1
  - L1

  weights:
  - 1.0
  - 1.0

data:
  name: MCRDataset
  data_dir: /data/dataset/Carlos/MCR
  num_workers: 16
  pin_memory: true
  process:
    transpose: true
    h_flip: true
    v_flip: true
    ratio: true
  test:
    batch_size: 1
    image_list_file: MCR_test_list.txt
  train:
    batch_size: 1
    image_list_file: MCR_train_list.txt
    patch_size: null
  valid:
    batch_size: 1
    image_list_file: MCR_test_list.txt

model:
  name: HiMA
  HiMA:
    in_channels: 4
    dims: 32
    layers: 4
    num_blocks_per_layer: [2,2,2,2]

train:
  base_lr: 2.0e-4
  last_lr_epoch: 300
  clip_grad: 0.1
  epochs: 300
  lr_scheduler:
    type: cosine
  optimizer: 
    type: muon
    eps: 1.0e-8
    betas: [0.9, 0.999]
  min_lr: 2.0e-5
  start_epoch: 0
  weight_decay: 0
  warmup_epochs: 0


<!-- templates/index.html -->
<!DOCTYPE html>
<html>
<head>
    <title>Image Processor</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }
        .container { 
            display: flex; 
            justify-content: space-between;
            margin-bottom: 20px;
        }
        .image-container { 
            width: 48%; 
            text-align: center;
        }
        img { 
            max-width: 100%; 
            max-height: 300px;
            border: 1px solid #ddd;
            margin-bottom: 5px;
        }
        .image-label {
            font-size: 12px;
            color: #666;
            margin-top: 0;
        }
        #buttons { 
            text-align: center; 
            margin-top: 20px;
            padding: 15px 0;
            border-top: 1px solid #eee;
        }
        button {
            margin: 0 5px;
            padding: 8px 15px;
            font-size: 12px;
            background-color: #f0f0f0;
            border: 1px solid #ccc;
            border-radius: 3px;
            cursor: pointer;
        }
        button:hover {
            background-color: #e0e0e0;
        }
        #fileInput {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="image-container">
            <img id="originalImg" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" alt="原始图像">
            <p class="image-label">原始图像</p>
        </div>
        <div class="image-container">
            <img id="processedImg" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" alt="处理结果">
            <p class="image-label">处理结果</p>
        </div>
    </div>

    <div id="buttons">
        <input type="file" id="fileInput" accept="image/*">
        <button onclick="document.getElementById('fileInput').click()">选择图片</button>
        <button onclick="processImage()">处理图片</button>
        <button onclick="downloadImage()">下载图片</button>
    </div>

    <script>
        let currentFile = null;
        let processedFile = null;

        document.getElementById('fileInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            
            reader.onload = function(e) {
                document.getElementById('originalImg').src = e.target.result;
                uploadFile(file);
            }
            reader.readAsDataURL(file);
        });

        async function uploadFile(file) {
            const formData = new FormData();
            formData.append('file', file);
            
            try {
                const response = await fetch('/upload', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                if(data.status === 'success') {
                    currentFile = data.filename;
                }
            } catch (error) {
                console.error('上传失败:', error);
            }
        }

        async function processImage() {
            if(!currentFile) {
                alert('请先选择图片');
                return;
            }
            
            try {
                const response = await fetch('/process', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({filename: currentFile})
                });
                
                const data = await response.json();
                if(data.error) {
                    alert(data.error);
                    return;
                }
                
                processedFile = data.processed_filename;
                document.getElementById('processedImg').src = `/static/processed/${processedFile}?t=${Date.now()}`;
            } catch (error) {
                console.error('处理失败:', error);
                alert('图片处理失败');
            }
        }

        function downloadImage() {
            if(!processedFile) {
                alert('请先处理图片');
                return;
            }
            window.location.href = `/download/${processedFile}`;
        }
    </script>
</body>
</html>
